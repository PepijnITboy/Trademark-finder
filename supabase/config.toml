# Minimal local Supabase configuration for Merkwacht.
# See https://supabase.com/docs/guides/local-development/cli/config
#
# Start the local stack with `supabase start` (requires Docker), then
# `pnpm db:setup` to apply supabase/migrations and supabase/seed.

project_id = "merkwacht"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
